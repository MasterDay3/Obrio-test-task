# Model registry. All providers are reached through their OpenAI-compatible endpoints.
# Prices are USD per 1M tokens, paid tier, standard (non-batch). Output prices include thinking tokens.
# Gemini: https://ai.google.dev/gemini-api/docs/pricing (checked 2026-10-25; 3.8 Flash doubles on 2027-01-01).
# Groq:   https://console.groq.com/docs/models (checked 2026-10-25). Groq prompt caching is automatic,
#         50% off cached input tokens (https://console.groq.com/docs/prompt-caching).
# Ollama runs locally, so its marginal API cost is 0.

providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  ollama:
    base_url_env: OLLAMA_BASE_URL
    base_url: http://localhost:11434/v1
    api_key: ollama

models:
  gemini-3.1-flash-lite:
    provider: gemini
    model: gemini-3.1-flash-lite
    input_per_mtok: 0.25
    output_per_mtok: 1.50
  gemini-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
    input_per_mtok: 0.30
    output_per_mtok: 2.50
  gemini-flash:
    provider: gemini
    model: gemini-3.8-flash
    input_per_mtok: 0.75
    output_per_mtok: 3.75
  groq-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    input_per_mtok: 0.15
    output_per_mtok: 0.60
    cached_input_per_mtok: 0.075
  groq-gpt-oss-120b-low:  # same model, less reasoning: cost/quality experiment
    provider: groq
    model: openai/gpt-oss-120b
    input_per_mtok: 0.15
    output_per_mtok: 0.60
    cached_input_per_mtok: 0.075
    extra_params: {reasoning_effort: low}
  groq-gpt-oss-20b:
    provider: groq
    model: openai/gpt-oss-20b
    input_per_mtok: 0.075
    output_per_mtok: 0.30
    cached_input_per_mtok: 0.0375
  ollama-qwen-7b:
    provider: ollama
    model: qwen2.5:7b
    input_per_mtok: 0.0
    output_per_mtok: 0.0

# Order in which models are tried when the previous one fails (timeout, 429, invalid JSON).
fallback_chain: [groq-gpt-oss-120b, gemini-flash-lite, groq-gpt-oss-20b]  # best quality first, then a different provider; ollama-qwen-7b skipped (not installed)
# Task 2 drafting: Gemini + draft_v4 passed every assistant check; gpt-oss-120b drafts (v1) leaked internal rules.
assistant_chain: [gemini-flash-lite, groq-gpt-oss-120b, groq-gpt-oss-20b]
